[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slurbuilds-research-agent"
version = "1.0.0"
description = "Bounded, stateful AI Research & Workflow Automation Agent with verified citations, LangSmith tracing, and offline demo mode"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SLURBUILDS AI VAULT", email = "vault@slurbuilds.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langsmith>=0.1.50",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
